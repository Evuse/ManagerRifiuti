[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manager-rifiuti"
version = "0.1.0"
description = "Importatore locale del calendario rifiuti per Home Assistant"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.9,<4", "onnxruntime>=1.24,<2"]
test = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "ruff>=0.6,<1"]
build = ["pyinstaller>=6.10,<7", "rapidocr>=3.9,<4", "onnxruntime>=1.24,<2"]

[project.scripts]
manager-rifiuti = "manager_rifiuti.app:main"

[tool.setuptools.packages.find]
include = ["manager_rifiuti*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100


