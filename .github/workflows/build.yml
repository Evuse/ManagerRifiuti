name: Build portatile
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15-intel
            artifact: macos-intel
          - os: macos-14
            artifact: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[build]"
      - run: pyinstaller manager-rifiuti.spec --clean --noconfirm
      - name: Prepara custom integration
        if: matrix.artifact == 'windows-x64'
        shell: bash
        run: |
          mkdir -p package/custom_components
          cp -R custom_components/manager_rifiuti package/custom_components/
      - uses: actions/upload-artifact@v4
        if: matrix.artifact == 'windows-x64'
        with:
          name: HomeAssistant-custom-component
          path: package/*
      - uses: actions/upload-artifact@v4
        with:
          name: ManagerRifiuti-${{ matrix.artifact }}
          path: dist/*
